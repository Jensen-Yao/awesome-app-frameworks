name: refresh-stars

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC（北京周一 10:00）自动刷新
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

concurrency:
  group: refresh-stars
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 刷新项目数据（Star 数 / 归档状态）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-stars.mjs
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "无变化，跳过提交" || git commit -m "chore: 自动刷新项目数据（Star 数/归档状态）[skip ci]"
          git push
